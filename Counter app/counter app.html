<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step Counter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#36d1dc,#5b86e5);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:360px;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.icon{
    font-size:70px;
}

h2{
    margin:15px 0;
    color:#333;
}

#steps{
    font-size:55px;
    color:#007bff;
    font-weight:bold;
    margin:20px 0;
}

p{
    color:#666;
    margin-bottom:20px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

.add{
    background:#28a745;
}

.remove{
    background:#dc3545;
}

.reset{
    background:#6c757d;
}

button:hover{
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="container">

<div class="icon">👟</div>

<h2>Daily Step Counter</h2>

<div id="steps">0</div>

<p>Total Steps Walked</p>

<button class="add" onclick="addSteps()">+100 Steps</button>

<button class="remove" onclick="removeSteps()">-100 Steps</button>

<button class="reset" onclick="resetSteps()">Reset</button>

</div>

<script>

let steps = 0;

function addSteps(){
    steps += 100;
    document.getElementById("steps").innerHTML = steps;
}

function removeSteps(){
    if(steps >= 100){
        steps -= 100;
    }
    document.getElementById("steps").innerHTML = steps;
}

function resetSteps(){
    steps = 0;
    document.getElementById("steps").innerHTML = steps;
}

</script>

</body>
</html>
